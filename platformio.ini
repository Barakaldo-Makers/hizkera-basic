[platformio]
lib_dir = ./

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
lib_deps = 
	
	sensirion/Sensirion Core @ 0.5.3
	sensirion/Sensirion I2C SCD4x @ 0.3.1
	https://github.com/limengdu/Seeed_60GHz_FallDetectionRadar.git
