; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;HIZKERA Proyect. Made by Barakaldo Makers . http:\\barakaldomakers.org

[platformio]
lib_dir = ./


[common]
platform = espressif32 
framework = arduino
upload_speed = 921600
monitor_speed = 115200
version = 0.1.1
revision = 50
target = Prod
monitor_filters = time
extra_scripts = pre:prebuild.py
build_flags = 
  -D CORE_DEBUG_LEVEL=0         # For debugging set to 3 and enable debug mode in the app
board_build.partitions = min_spiffs.csv
lib_deps = 
	;bblanchon/ArduinoJson @ 6.19.4
	sensirion/Sensirion Core @ 0.5.3
	sensirion/Sensirion I2C SCD4x @ 0.3.1


;[oled_common]
;extends = common
;lib_ignore = gui-utils-tft
;lib_deps = 
;	${common.lib_deps}
;	U8g2 @ ^2.28.8

[env:TTGO_T7]
;extends = oled_common
board = ttgo-t7-v14-mini32
extends = common


[env:ESP32DEVKIT]
;extends = oled_common
board = lolin32
upload_speed = 921600
extends = common

[env:TTGOLORA32V1]
board = ttgo-lora32-v1
extends = common

[env:M5PICOD4]
;board = lolin32
board = pico32
extends = common
build_flags = 
       ${common.build_flags}
       ;-D RXD2=18
	   ;-D TXD2=19
lib_deps = 
	${common.lib_deps}
	;m5stack/STAMP-PICO@^0.0.2
